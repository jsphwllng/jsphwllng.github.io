<!DOCTYPE html>
<html lang="en" prefix="og: http://ogp.me/ns#">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- HTML Meta Tags -->
    <meta name="description" content="{{ page.description }}" />

    <!-- Facebook Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{ page.title }}" />
    <meta property="og:description" content="{{ page.description }}" />

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary" />
    <meta property="twitter:domain" content="josephwelling.com" />
    <meta property="twitter:url" content="{{ page.title }}" />
    <meta name="twitter:title" content="{{ page.title }}" />
    <meta name="twitter:description" content="{{ page.description }}" />
    <title>{{ page.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" />
    <link rel="stylesheet" href="/assets/css/styles.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="/"{% if page.url == "/" %} aria-current="page"{% endif %}>Joseph Welling</a>
        <a href="/blog"{% if page.url == "/blog" or page.collection == "blog" %} aria-current="page"{% endif %}>Blog</a>
        <a href="/contact"{% if page.url == "/contact" %} aria-current="page"{% endif %}>Contact</a>
      </nav>
    </header>
    <main>
      {% if page.collection == "blog" %}
      <h1>{{ page.title }}</h1>
      {% if page.description %}
      <div class="meta">{{ page.description }}</div>
      {% endif %}
      {% endif %}
      {{ content }}
    </main>
    {% include footer.html %}
  </body>
</html>
