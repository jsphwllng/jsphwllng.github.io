---
layout: default
title: Blog
---
<ul class="list">
  {% assign posts = site.blog | sort: 'order' | reverse %}
  {% for blog in posts %}
  {% unless blog.title == "Default" %}
  <li><a href="{{ blog.url }}">{{ blog.title | downcase }}</a><span>{{ blog.order | prepend: '0' | slice: -2, 2 }}</span></li>
  {% endunless %}
  {% endfor %}
</ul>
